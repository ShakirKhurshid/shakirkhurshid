<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390">
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #ffffff; }
    .hi   { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; fill: #cfcfcf; }
    .name { font-size: 46px; }
    .bio  { font-size: 18px; fill: #cfcfcf; }
    .stat { font-size: 22px; }
    .icon { fill: none; stroke: #ffffff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Card background -->
  <rect width="800" height="390" rx="16" fill="#1f1f1f"/>

  <!-- Greeting + name (EDIT) -->
  <text x="40" y="60" class="hi">👋 hi i'm</text>
  <text x="40" y="115" class="mono name">Shakir</text>

  <!-- Short bio (EDIT) -->
  <text x="40" y="190" class="mono bio">Software Engineer · Motorcycles · Video Games</text>

  <!-- Avatar: replace the circle + initials with your photo (see README) -->
  <clipPath id="avatarClip"><circle cx="680" cy="110" r="65"/></clipPath>
  <image href="data:image/jpeg;base64," x="615" y="45" width="130" height="130" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- Stats (EDIT numbers) -->
  <g transform="translate(40,250)">
    <path class="icon" d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7-6.3-3.6-6.3 3.6 1.5-7L2 9.3l7-.8z"/>
  </g>
  <text x="80" y="270" class="mono stat">8 stars contributed to</text>

  <g transform="translate(40,290)">
    <line class="icon" x1="0" y1="12" x2="7" y2="12"/>
    <circle class="icon" cx="13" cy="12" r="6"/>
    <line class="icon" x1="19" y1="12" x2="26" y2="12"/>
  </g>
  <text x="80" y="310" class="mono stat">13 commits in last year</text>

  <g transform="translate(40,328)">
    <circle class="icon" cx="9" cy="7" r="4"/>
    <path class="icon" d="M2 20c0-4 3-6 7-6s7 2 7 6"/>
    <path class="icon" d="M17 3.5a4 4 0 0 1 0 7M20 14c2 1 3 3 3 6"/>
  </g>
  <text x="80" y="347" class="mono stat">2 followers</text>
</svg>
